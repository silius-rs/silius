[package]
name = "silius"
description = "A Rust implementation of the ERC-4337 account abstraction bundler."
authors.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "silius"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive", "env"] }
tokio.workspace = true
tracing = { workspace = true, features = ["log"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# silius dependencies
silius-executor.workspace = true
silius-node-version.workspace = true
silius-primitives.workspace = true
silius-rpc.workspace = true
silius-storage.workspace = true
